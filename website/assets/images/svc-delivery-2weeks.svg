<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Two-week delivery: diagnose, build, deploy, hand over">
  <title>Two-week delivery from scope to handover</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F5F8FF"/><stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#C5CEE6" opacity="0.55"/>
    </pattern>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F62FE" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="328" rx="20" fill="none" stroke="#DFE5F5" stroke-width="2"/>

  <g font-family="Geist, Helvetica, Arial, sans-serif">
    <text x="56" y="50" font-size="14" font-weight="700" letter-spacing="2.4" fill="#0F62FE">THE METHOD</text>
    <text x="56" y="82" font-size="24" font-weight="700" fill="#101828">Two weeks from scope to handover</text>
    <rect x="836" y="34" width="308" height="30" rx="15" fill="#EAF1FF" stroke="#C9DBFF"/>
    <text x="990" y="54" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".8" fill="#0F62FE">FIXED SCOPE · OWNERSHIP TRANSFERRED</text>

    <line x1="92" y1="150" x2="1108" y2="150" stroke="#C9DBFF" stroke-width="2" stroke-dasharray="6 7"/>
    <g fill="#0F62FE">
      <circle cx="176" cy="150" r="9"/><circle cx="470" cy="150" r="9"/><circle cx="764" cy="150" r="9"/><circle cx="1058" cy="150" r="9"/>
    </g>

    <g filter="url(#sh)">
      <rect x="56" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="350" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="644" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="938" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
    </g>

    <g font-size="12" font-weight="700" letter-spacing="1.6" fill="#0F62FE">
      <text x="80" y="204">01 · DIAGNOSE</text>
      <text x="374" y="204">02 · BUILD</text>
      <text x="668" y="204">03 · DEPLOY</text>
      <text x="962" y="204">04 · HAND OVER</text>
    </g>
    <g font-size="14.5" font-weight="600" fill="#101828">
      <text x="80" y="232">Fix the outcome</text>
      <text x="374" y="232">Connect the data</text>
      <text x="668" y="232">Go live in-channel</text>
      <text x="962" y="232">Your team owns it</text>
    </g>
    <g font-size="12.5" fill="#5B6785">
      <text x="80" y="256">24-question readiness audit,</text><text x="80" y="274">smallest useful scope in writing.</text>
      <text x="374" y="256">Governed connectors and flows,</text><text x="374" y="274">role-based permissions.</text>
      <text x="668" y="256">Assistant live inside the tools</text><text x="668" y="274">your team already uses.</text>
      <text x="962" y="256">Runbooks, monitoring, the</text><text x="962" y="274">compliance loop and the keys.</text>
    </g>
  </g>
</svg>
