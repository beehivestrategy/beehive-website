<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="AI is the destination: AI in production is the main focus, with data and digital work scoped as enablers">
  <title>AI-led transformation: AI in production, data foundation, digital plumbing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F5F8FF"/><stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F62FE"/><stop offset="1" stop-color="#0043CE"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#C5CEE6" opacity="0.55"/>
    </pattern>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F62FE" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="618" rx="20" fill="none" stroke="#DFE5F5" stroke-width="2"/>

  <g font-family="Geist, Helvetica, Arial, sans-serif">
    <text x="56" y="52" font-size="14" font-weight="700" letter-spacing="2.4" fill="#0F62FE">AI-LED TRANSFORMATION</text>
    <text x="1144" y="52" text-anchor="end" font-size="14" fill="#5B6785">Scoped backwards from a live AI outcome</text>

    <!-- Layer 1: AI in production -->
    <rect x="56" y="76" width="1088" height="168" rx="16" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2" filter="url(#sh)"/>
    <rect x="56" y="76" width="9" height="168" rx="4" fill="url(#brand)"/>
    <text x="90" y="112" font-size="13" font-weight="700" letter-spacing="1.8" fill="#0F62FE">01</text>
    <text x="128" y="114" font-size="23" font-weight="700" fill="#101828">AI in production</text>
    <rect x="976" y="94" width="168" height="28" rx="14" fill="#0F62FE"/>
    <text x="1060" y="113" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#FFFFFF">MAIN FOCUS</text>
    <text x="90" y="140" font-size="13.5" fill="#5B6785">Conversational AI, agents, evaluation, monitoring and the governance loop. This is what we are accountable for.</text>
    <g font-size="13" font-weight="600" fill="#0F62FE">
      <rect x="90" y="162" width="202" height="48" rx="10" fill="#EAF1FF" stroke="#C9DBFF"/>
      <text x="191" y="191" text-anchor="middle">Conversational AI</text>
      <rect x="304" y="162" width="164" height="48" rx="10" fill="#EAF1FF" stroke="#C9DBFF"/>
      <text x="386" y="191" text-anchor="middle">AI agents</text>
      <rect x="480" y="162" width="164" height="48" rx="10" fill="#EAF1FF" stroke="#C9DBFF"/>
      <text x="562" y="191" text-anchor="middle">Evaluation</text>
      <rect x="656" y="162" width="226" height="48" rx="10" fill="#EAF1FF" stroke="#C9DBFF"/>
      <text x="769" y="191" text-anchor="middle">Monitoring &amp; governance</text>
    </g>

    <!-- scope arrow -->
    <g stroke="#78A9FF" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M600 250 L600 282"/>
      <path d="M594 276 L600 282 L606 276"/>
    </g>
    <text x="620" y="273" font-size="12.5" fill="#5B6785" font-family="Geist, Helvetica, Arial, sans-serif">scope the work below from this outcome, not the other way round</text>

    <!-- Layer 2: data foundation -->
    <rect x="56" y="292" width="1088" height="132" rx="16" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="56" y="292" width="9" height="132" rx="4" fill="#78A9FF"/>
    <text x="90" y="326" font-size="13" font-weight="700" letter-spacing="1.8" fill="#0F62FE">02</text>
    <text x="128" y="328" font-size="21" font-weight="700" fill="#101828">Data foundation</text>
    <rect x="976" y="308" width="168" height="26" rx="13" fill="#EAF1FF"/>
    <text x="1060" y="326" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".6" fill="#0F62FE">ONLY WHAT AI NEEDS</text>
    <text x="90" y="352" font-size="13.5" fill="#5B6785">Semantic layer, connectors, quality checks and lineage — scoped to the use case, not a greenfield platform.</text>
    <g font-size="12.5" font-weight="600" fill="#0043CE">
      <rect x="90" y="368" width="166" height="40" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="173" y="393" text-anchor="middle">Semantic layer</text>
      <rect x="268" y="368" width="140" height="40" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="338" y="393" text-anchor="middle">Connectors</text>
      <rect x="420" y="368" width="172" height="40" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="506" y="393" text-anchor="middle">Quality &amp; lineage</text>
      <rect x="604" y="368" width="160" height="40" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="684" y="393" text-anchor="middle">Access control</text>
    </g>

    <!-- Layer 3: digital plumbing -->
    <rect x="56" y="436" width="1088" height="122" rx="16" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="56" y="436" width="9" height="122" rx="4" fill="#C5CEE6"/>
    <text x="90" y="470" font-size="13" font-weight="700" letter-spacing="1.8" fill="#5B6785">03</text>
    <text x="128" y="472" font-size="21" font-weight="700" fill="#101828">Digital plumbing</text>
    <rect x="976" y="452" width="168" height="26" rx="13" fill="#F4F7FF"/>
    <text x="1060" y="470" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing=".6" fill="#5B6785">WHERE IT UNBLOCKS</text>
    <text x="90" y="494" font-size="13.5" fill="#5B6785">Identity, system integration and channel endpoints. We work around your existing stack, not replace it.</text>
    <g font-size="12.5" font-weight="600" fill="#5B6785">
      <rect x="90" y="508" width="176" height="38" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="178" y="532" text-anchor="middle">Systems of record</text>
      <rect x="278" y="508" width="120" height="38" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="338" y="532" text-anchor="middle">Identity</text>
      <rect x="410" y="508" width="184" height="38" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="502" y="532" text-anchor="middle">Channel endpoints</text>
      <rect x="606" y="508" width="150" height="38" rx="9" fill="#F4F7FF" stroke="#DFE5F5"/>
      <text x="681" y="532" text-anchor="middle">Existing BI tools</text>
    </g>

    <text x="56" y="592" font-size="13.5" font-weight="600" fill="#101828">Digital + data transformation still happens — as enablers, never as the deliverable.</text>
    <text x="1144" y="592" text-anchor="end" font-size="12.5" fill="#5B6785">No rip-and-replace. First live system in weeks.</text>
  </g>
</svg>
