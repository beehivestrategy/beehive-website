<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="两周交付：诊断、建置、部署、移交">
  <title>从定范围到移交，两周</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#F5F8FF"/><stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#C5CEE6" opacity="0.55"/>
    </pattern>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F62FE" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="328" rx="20" fill="none" stroke="#DFE5F5" stroke-width="2"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="56" y="50" font-size="14" font-weight="700" letter-spacing="1" fill="#0F62FE">交付方法</text>
    <text x="56" y="82" font-size="24" font-weight="700" fill="#101828">从定范围到移交，两周</text>
    <rect x="974" y="34" width="170" height="30" rx="15" fill="#EAF1FF" stroke="#C9DBFF"/>
    <text x="1059" y="54" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.3" fill="#0F62FE">范围固定 · 所有权移交</text>

    <line x1="92" y1="150" x2="1108" y2="150" stroke="#C9DBFF" stroke-width="2" stroke-dasharray="6 7"/>
    <g fill="#0F62FE">
      <circle cx="176" cy="150" r="9"/><circle cx="470" cy="150" r="9"/><circle cx="764" cy="150" r="9"/><circle cx="1058" cy="150" r="9"/>
    </g>

    <g filter="url(#sh)">
      <rect x="56" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="350" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="644" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
      <rect x="938" y="176" width="240" height="112" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5"/>
    </g>

    <g font-size="12" font-weight="700" letter-spacing="0.8" fill="#0F62FE">
      <text x="80" y="204">01 · 诊断</text>
      <text x="374" y="204">02 · 建置</text>
      <text x="668" y="204">03 · 部署</text>
      <text x="962" y="204">04 · 移交</text>
    </g>
    <g font-size="14.5" font-weight="600" fill="#101828">
      <text x="80" y="232">锁定结果</text>
      <text x="374" y="232">接通数据</text>
      <text x="668" y="232">在渠道里上线</text>
      <text x="962" y="232">团队自己接管</text>
    </g>
    <g font-size="12.5" fill="#5B6785">
      <text x="80" y="256">24 题就绪度自评，</text><text x="80" y="274">书面的最小可用范围。</text>
      <text x="374" y="256">受治理的连接器与流程，</text><text x="374" y="274">按角色分配权限。</text>
      <text x="668" y="256">助理直接嵌进团队</text><text x="668" y="274">日常在用的工具。</text>
      <text x="962" y="256">运行手册、监控、</text><text x="962" y="274">合规闭环与全部权限。</text>
    </g>
  </g>
</svg>
