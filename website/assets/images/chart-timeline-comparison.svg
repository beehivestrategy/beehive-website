<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none" role="img" aria-label="Bar chart comparing delivery timeline: Beehive 2 weeks versus industry norm 6 months">
  <defs>
    <linearGradient id="b1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e7a6b"/><stop offset="100%" stop-color="#3dd4b0"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b8922f"/><stop offset="100%" stop-color="#f0d78c"/>
    </linearGradient>
  </defs>

  <!-- baseline -->
  <path d="M60 250 L600 250" stroke="#8a9e96" stroke-opacity="0.35"/>

  <!-- bars -->
  <g>
    <rect x="120" y="216" width="120" height="34" rx="6" fill="url(#b1)"/>
    <text x="180" y="240" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a0e0d">2 weeks</text>

    <rect x="330" y="70" width="120" height="180" rx="6" fill="url(#b2)"/>
    <text x="390" y="164" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0a0e0d">6 months</text>
  </g>

  <!-- labels -->
  <g font-family="General Sans, system-ui, sans-serif" font-size="12" fill="#8a9e96" text-anchor="middle">
    <text x="180" y="274">Beehive deployment</text>
    <text x="390" y="274">Industry norm</text>
  </g>

  <!-- delta callout -->
  <g>
    <rect x="470" y="120" width="140" height="56" rx="10" fill="#2B9E8B" fill-opacity="0.12" stroke="#2B9E8B" stroke-opacity="0.4"/>
    <text x="540" y="144" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="18" font-weight="700" fill="#3dd4b0">~12x</text>
    <text x="540" y="164" text-anchor="middle" font-family="General Sans, system-ui, sans-serif" font-size="10.5" fill="#8a9e96">faster to production</text>
  </g>
</svg>
