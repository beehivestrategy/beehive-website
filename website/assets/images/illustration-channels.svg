<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" fill="none" role="img" aria-label="Diagram: your channels feed the AI, which writes results back into your systems">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B9E8B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- left: channels -->
  <g>
    <rect x="16" y="30" width="150" height="200" rx="16" fill="url(#cg)" stroke="#2B9E8B" stroke-opacity="0.3"/>
    <text x="91" y="58" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0f0f0">YOUR CHANNELS</text>
    <g font-family="General Sans, system-ui, sans-serif" font-size="11" fill="#8a9e96">
      <text x="91" y="88" text-anchor="middle">WeChat Work</text>
      <text x="91" y="112" text-anchor="middle">DingTalk</text>
      <text x="91" y="136" text-anchor="middle">Feishu</text>
      <text x="91" y="160" text-anchor="middle">WhatsApp</text>
      <text x="91" y="184" text-anchor="middle">Teams · Telegram</text>
      <text x="91" y="208" text-anchor="middle">LINE · Your site</text>
    </g>
  </g>

  <!-- middle: AI core -->
  <g>
    <rect x="240" y="60" width="200" height="140" rx="20" fill="#2B9E8B" fill-opacity="0.14" stroke="#2B9E8B" stroke-opacity="0.55"/>
    <path d="M340 78 L372 96 L372 132 L340 150 L308 132 L308 96 Z" stroke="#3dd4b0" stroke-width="1.6" fill="#2B9E8B" fill-opacity="0.25"/>
    <text x="340" y="122" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0f0f0">GOVERNED AI</text>
    <text x="340" y="142" text-anchor="middle" font-family="General Sans, system-ui, sans-serif" font-size="10" fill="#8a9e96">flows · knowledge · audit</text>
  </g>

  <!-- right: systems -->
  <g>
    <rect x="514" y="30" width="150" height="200" rx="16" fill="url(#cg)" stroke="#d4a843" stroke-opacity="0.35"/>
    <text x="589" y="58" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0f0f0">YOUR SYSTEMS</text>
    <g font-family="General Sans, system-ui, sans-serif" font-size="11" fill="#8a9e96">
      <text x="589" y="88" text-anchor="middle">CRM</text>
      <text x="589" y="112" text-anchor="middle">Orders</text>
      <text x="589" y="136" text-anchor="middle">Ticketing</text>
      <text x="589" y="160" text-anchor="middle">ERP</text>
      <text x="589" y="184" text-anchor="middle">Data stack</text>
      <text x="589" y="208" text-anchor="middle">Reporting</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#3dd4b0" stroke-width="1.6" stroke-opacity="0.75">
    <path d="M166 110 L238 110"/>
    <path d="M166 150 L238 150"/>
  </g>
  <g stroke="#d4a843" stroke-width="1.6" stroke-opacity="0.8">
    <path d="M440 110 L512 110"/>
    <path d="M440 150 L512 150"/>
  </g>
  <g fill="#3dd4b0"><polygon points="238,110 230,105 230,115"/><polygon points="238,150 230,145 230,155"/></g>
  <g fill="#d4a843"><polygon points="512,110 520,105 520,115"/><polygon points="512,150 520,145 520,155"/></g>

  <text x="202" y="98" text-anchor="middle" font-family="General Sans, system-ui, sans-serif" font-size="9.5" fill="#5a6e66">ask</text>
  <text x="476" y="98" text-anchor="middle" font-family="General Sans, system-ui, sans-serif" font-size="9.5" fill="#5a6e66">write back</text>
</svg>
