<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Four service lines converge on one accountable outcome: AI running in production">
  <title>Beehive Strategy service lines: Conversational AI, Agentic Tools, Forward Deployed Engineering and Training all lead to AI in production</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset="0.55" stop-color="#0043CE"/>
      <stop offset="1" stop-color="#002D9C"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DFE5F5"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#wash)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#0F62FE">WHAT WE DO</text>
  <text x="60" y="98" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#101828">One outcome. Four ways in.</text>
  <text x="60" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4A5568">Every service line is scoped backwards from AI that is actually running.</text>

  <!-- outcome band -->
  <rect x="60" y="158" width="1080" height="104" rx="16" fill="url(#band)"/>
  <text x="92" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#BFD4FF">THE ACCOUNTABLE OUTCOME</text>
  <text x="92" y="234" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">AI in production, inside the tools your team already uses</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
    <rect x="854" y="188" width="94" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="870" y="206">assistants</text>
    <rect x="958" y="188" width="74" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="974" y="206">agents</text>
    <rect x="1042" y="188" width="70" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1056" y="206">eval</text>
  </g>

  <!-- connectors -->
  <g stroke="#C5CEE6" stroke-width="2">
    <line x1="187" y1="262" x2="187" y2="318"/>
    <line x1="462" y1="262" x2="462" y2="318"/>
    <line x1="737" y1="262" x2="737" y2="318"/>
    <line x1="1012" y1="262" x2="1012" y2="318"/>
  </g>
  <g fill="#0F62FE">
    <circle cx="187" cy="262" r="5"/><circle cx="462" cy="262" r="5"/>
    <circle cx="737" cy="262" r="5"/><circle cx="1012" cy="262" r="5"/>
  </g>

  <!-- four equal service cards -->
  <g>
    <rect x="60" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
    <rect x="335" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="610" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="885" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="84" y="352" font-size="11" font-weight="700" letter-spacing="1.4" fill="#0F62FE">01 · MAIN FOCUS</text>
    <text x="84" y="384" font-size="19" font-weight="700" fill="#101828">Conversational AI</text>
    <text x="84" y="414" font-size="13" fill="#4A5568">Ask in plain language, get</text>
    <text x="84" y="434" font-size="13" fill="#4A5568">a governed, traceable answer</text>
    <text x="84" y="464" font-size="12" font-weight="700" fill="#0F62FE">in-channel, not in a portal</text>

    <text x="359" y="352" font-size="11" font-weight="700" letter-spacing="1.4" fill="#8B94A8">02</text>
    <text x="359" y="384" font-size="19" font-weight="700" fill="#101828">Agentic Tools</text>
    <text x="359" y="414" font-size="13" fill="#4A5568">Select and sandbox agents</text>
    <text x="359" y="434" font-size="13" fill="#4A5568">with evaluation, permissions</text>
    <text x="359" y="464" font-size="12" font-weight="700" fill="#0043CE">and a compliance loop</text>

    <text x="634" y="352" font-size="11" font-weight="700" letter-spacing="1.4" fill="#8B94A8">03</text>
    <text x="634" y="384" font-size="19" font-weight="700" fill="#101828">FDE Delivery</text>
    <text x="634" y="414" font-size="13" fill="#4A5568">Embedded engineering that</text>
    <text x="634" y="434" font-size="13" fill="#4A5568">ships, deploys and hands over</text>
    <text x="634" y="464" font-size="12" font-weight="700" fill="#0043CE">the keys in weeks</text>

    <text x="909" y="352" font-size="11" font-weight="700" letter-spacing="1.4" fill="#8B94A8">04</text>
    <text x="909" y="384" font-size="19" font-weight="700" fill="#101828">Training &amp; Enablement</text>
    <text x="909" y="414" font-size="13" fill="#4A5568">Build the vocabulary and the</text>
    <text x="909" y="434" font-size="13" fill="#4A5568">internal capability before you</text>
    <text x="909" y="464" font-size="12" font-weight="700" fill="#0043CE">sign anything</text>
  </g>

  <line x1="60" y1="526" x2="1140" y2="526" stroke="#DFE5F5" stroke-width="2"/>
  <text x="60" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4A5568">Data foundation, digital integration and governance still happen on every engagement — scoped to the AI outcome, never as the headline deliverable.</text>
  <text x="60" y="584" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0F62FE">No rip-and-replace. First live system in weeks.</text>
</svg>
