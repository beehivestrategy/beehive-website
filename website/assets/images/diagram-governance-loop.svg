<svg xmlns="http://www.w3.org/2000/svg" width="620" height="240" viewBox="0 0 620 240" fill="none" role="img" aria-label="Governance loop: observe, decide, write back to production, measure">
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B9E8B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2B9E8B" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- loop path -->
  <path d="M310 40 C 430 40 500 90 500 140 C 500 190 430 220 310 220 C 190 220 120 190 120 140 C 120 90 190 40 310 40"
        stroke="#2B9E8B" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="6 7"/>

  <!-- nodes -->
  <g font-family="Satoshi, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0f0f0">
    <g>
      <rect x="240" y="16" width="140" height="48" rx="12" fill="url(#lg1)" stroke="#2B9E8B" stroke-opacity="0.5"/>
      <text x="310" y="45" text-anchor="middle">1 · OBSERVE</text>
    </g>
    <g>
      <rect x="466" y="112" width="130" height="48" rx="12" fill="url(#lg1)" stroke="#d4a843" stroke-opacity="0.5"/>
      <text x="531" y="141" text-anchor="middle">2 · DECIDE</text>
    </g>
    <g>
      <rect x="240" y="176" width="140" height="48" rx="12" fill="url(#lg1)" stroke="#d4a843" stroke-opacity="0.5"/>
      <text x="310" y="205" text-anchor="middle">3 · WRITE BACK</text>
    </g>
    <g>
      <rect x="24" y="112" width="130" height="48" rx="12" fill="url(#lg1)" stroke="#2B9E8B" stroke-opacity="0.5"/>
      <text x="89" y="141" text-anchor="middle">4 · MEASURE</text>
    </g>
  </g>

  <!-- centre label -->
  <text x="310" y="132" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3dd4b0">GOVERNANCE</text>
  <text x="310" y="152" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="13" font-weight="700" fill="#3dd4b0">LOOP</text>

  <!-- direction arrows -->
  <g fill="#3dd4b0" fill-opacity="0.85">
    <polygon points="452,52 440,44 442,58"/>
    <polygon points="556,168 568,160 566,176"/>
    <polygon points="168,168 156,176 158,160"/>
    <polygon points="64,52 52,58 54,44"/>
  </g>
</svg>
