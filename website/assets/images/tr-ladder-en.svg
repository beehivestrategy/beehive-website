<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Three-step learning ladder: webinar, then workshop, then deep-dive, across seven published courses">
  <title>Three-step learning ladder: webinar, then workshop, then deep-dive, across seven published courses</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset="1" stop-color="#0043CE"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DFE5F5"/>
    </pattern>
  </defs>

  <rect width="760" height="360" fill="url(#wash)"/>
  <rect width="760" height="360" fill="url(#dots)"/>
  <text x="34" y="45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#0F62FE">LEARNING LADDER</text>
  <text x="726" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1" fill="#4A5568">7 COURSES  ·  284 LESSONS</text>
  <line x1="34" y1="68" x2="726" y2="68" stroke="#C5CEE6" stroke-width="1"/>
  <path d="M60 104 H700" stroke="#C5CEE6" stroke-width="2" stroke-dasharray="6 7" fill="none"/>
  <path d="M694 99 L702 104 L694 109" stroke="#0F62FE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="182" width="200" height="104" rx="10" fill="url(#step)" opacity="0.42"/>
  <text x="60" y="220" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828">WEBINAR</text>
  <text x="60" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4A5568">01  ·  90 MIN</text>
  <line x1="44" y1="300" x2="244" y2="300" stroke="#C5CEE6" stroke-width="1"/>
  <text x="46" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0F62FE">01</text>
  <rect x="280" y="130" width="200" height="156" rx="10" fill="url(#step)" opacity="0.70"/>
  <text x="296" y="168" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#101828">WORKSHOP</text>
  <text x="296" y="194" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4A5568">02  ·  HALF DAY</text>
  <line x1="280" y1="300" x2="480" y2="300" stroke="#C5CEE6" stroke-width="1"/>
  <text x="282" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0F62FE">02</text>
  <rect x="516" y="78" width="200" height="208" rx="10" fill="url(#step)" opacity="1.00"/>
  <text x="532" y="116" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">DEEP-DIVE</text>
  <text x="532" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#DBE7FF">03  ·  MULTI-WEEK</text>
  <line x1="516" y1="300" x2="716" y2="300" stroke="#C5CEE6" stroke-width="1"/>
  <text x="518" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#0F62FE">03</text>
</svg>
