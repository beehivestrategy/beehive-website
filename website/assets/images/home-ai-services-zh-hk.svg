<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="四條服務線共同指向一個可驗收成果：AI 在生產環境中真正運行">
  <title>蜂啟諮詢四條服務線：對話式 AI、AI 代理與工具、前置部署工程、培訓與能力建設，都指向生產環境中的 AI</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset="0.55" stop-color="#0043CE"/>
      <stop offset="1" stop-color="#002D9C"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DFE5F5"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#wash)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text x="60" y="58" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#0F62FE">我們做甚麼</text>
  <text x="60" y="98" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="700" fill="#101828">一個結果，四種切入。</text>
  <text x="60" y="126" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="15" fill="#4A5568">每條服務線都從實際投入運作的 AI 反向界定。</text>

  <!-- outcome band -->
  <rect x="60" y="158" width="1080" height="104" rx="16" fill="url(#band)"/>
  <text x="92" y="196" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#BFD4FF">我們負責的結果</text>
  <text x="92" y="234" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">AI 在團隊日常在用的工具裏實際投入運作</text>
  <g font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
    <rect x="944" y="188" width="56" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="972" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">助理</text>
    <rect x="1008" y="188" width="68" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1042" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">代理</text>
    <rect x="1084" y="188" width="56" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1112" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">評估</text>
  </g>

  <!-- connectors -->
  <g stroke="#C5CEE6" stroke-width="2">
    <line x1="187" y1="262" x2="187" y2="318"/>
    <line x1="462" y1="262" x2="462" y2="318"/>
    <line x1="737" y1="262" x2="737" y2="318"/>
    <line x1="1012" y1="262" x2="1012" y2="318"/>
  </g>
  <g fill="#0F62FE">
    <circle cx="187" cy="262" r="5"/><circle cx="462" cy="262" r="5"/>
    <circle cx="737" cy="262" r="5"/><circle cx="1012" cy="262" r="5"/>
  </g>

  <!-- four equal service cards -->
  <g>
    <rect x="60" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
    <rect x="335" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="610" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="885" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
  </g>

  <g font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif">
    <text x="84" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#0F62FE">01 · 核心</text>
    <text x="84" y="384" font-size="19" font-weight="700" fill="#101828">對話式 AI</text>
    <text x="84" y="414" font-size="13" fill="#4A5568">用自然語言提問，</text>
    <text x="84" y="434" font-size="13" fill="#4A5568">得到受管治、可追溯的答案</text>
    <text x="84" y="464" font-size="12" font-weight="700" fill="#0F62FE">就在渠道裏，不用另開平台</text>

    <text x="359" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">02</text>
    <text x="359" y="384" font-size="19" font-weight="700" fill="#101828">AI 代理與工具</text>
    <text x="359" y="414" font-size="13" fill="#4A5568">挑選代理並放進沙箱，</text>
    <text x="359" y="434" font-size="13" fill="#4A5568">配好評估、權限</text>
    <text x="359" y="464" font-size="12" font-weight="700" fill="#0043CE">與合規循環</text>

    <text x="634" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">03</text>
    <text x="634" y="384" font-size="19" font-weight="700" fill="#101828">前置部署工程</text>
    <text x="634" y="414" font-size="13" fill="#4A5568">工程團隊駐場交付，</text>
    <text x="634" y="434" font-size="13" fill="#4A5568">建構、部署，數星期內</text>
    <text x="634" y="464" font-size="12" font-weight="700" fill="#0043CE">把系統的鎖匙交回</text>

    <text x="909" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">04</text>
    <text x="909" y="384" font-size="19" font-weight="700" fill="#101828">培訓與能力建設</text>
    <text x="909" y="414" font-size="13" fill="#4A5568">先建立共同語言</text>
    <text x="909" y="434" font-size="13" fill="#4A5568">與內部能力，再</text>
    <text x="909" y="464" font-size="12" font-weight="700" fill="#0043CE">談簽約</text>
  </g>

  <line x1="60" y1="526" x2="1140" y2="526" stroke="#DFE5F5" stroke-width="2"/>
  <text x="60" y="560" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="13" fill="#4A5568">每個項目都仍會做數據基礎、系統整合與管治——按 AI 結果界定範圍，從不把它們當作交付主角。</text>
  <text x="60" y="584" font-family="'PingFang HK','PingFang TC','Hiragino Sans CNS','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="12" font-weight="700" fill="#0F62FE">不推倒重來，數星期內投入運作首個可用系統。</text>
</svg>
