<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" fill="none" role="img" aria-label="Six-axis AI readiness radar profile">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B9E8B" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- grid rings -->
  <g stroke="#2B9E8B" stroke-opacity="0.18" fill="none">
    <polygon points="210,50 339,110 339,230 210,290 81,230 81,110"/>
    <polygon points="210,90 294,130 294,210 210,250 126,210 126,130"/>
    <polygon points="210,130 249,150 249,190 210,210 171,190 171,150"/>
  </g>
  <!-- spokes -->
  <g stroke="#2B9E8B" stroke-opacity="0.22">
    <path d="M210 170 L210 50"/><path d="M210 170 L339 110"/>
    <path d="M210 170 L339 230"/><path d="M210 170 L210 290"/>
    <path d="M210 170 L81 230"/><path d="M210 170 L81 110"/>
  </g>

  <!-- profile polygon (illustrative) -->
  <polygon points="210,72 316,122 300,214 210,262 116,212 108,126"
           fill="url(#rg)" stroke="#3dd4b0" stroke-width="1.8"/>
  <g fill="#3dd4b0">
    <circle cx="210" cy="72" r="3.6"/><circle cx="316" cy="122" r="3.6"/>
    <circle cx="300" cy="214" r="3.6"/><circle cx="210" cy="262" r="3.6"/>
    <circle cx="116" cy="212" r="3.6"/><circle cx="108" cy="126" r="3.6"/>
  </g>

  <!-- axis labels -->
  <g font-family="General Sans, system-ui, sans-serif" font-size="10.5" fill="#8a9e96" text-anchor="middle">
    <text x="210" y="36">Strategy</text>
    <text x="356" y="106">Data</text>
    <text x="356" y="240">Governance</text>
    <text x="210" y="308">Channels</text>
    <text x="64" y="240">Skills</text>
    <text x="64" y="106">Use cases</text>
  </g>
</svg>
