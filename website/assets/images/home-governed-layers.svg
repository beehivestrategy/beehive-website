<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 120 1120 510" width="1120" height="510" role="img" aria-label="Governed layers: every answer traces back to an inspectable source">
  <title>Governed layers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#F4F7FF"/><stop offset="1" stop-color="#E7EEFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F62FE"/><stop offset="1" stop-color="#002D9C"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C5CEE6" opacity="0.65"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F62FE" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="748" rx="20" fill="none" stroke="#DFE5F5" stroke-width="2"/>

  <!-- source nodes on the left -->
  <g fill="#FFFFFF" stroke="#DFE5F5" stroke-width="1.5" filter="url(#sh)">
    <rect x="70" y="150" width="170" height="86" rx="14"/>
    <rect x="70" y="270" width="170" height="86" rx="14"/>
    <rect x="70" y="390" width="170" height="86" rx="14"/>
    <rect x="70" y="510" width="170" height="86" rx="14"/>
  </g>
  <g fill="#0F62FE">
    <circle cx="106" cy="193" r="16" opacity="0.9"/><circle cx="106" cy="313" r="16" opacity="0.7"/>
    <circle cx="106" cy="433" r="16" opacity="0.8"/><circle cx="106" cy="553" r="16" opacity="0.6"/>
  </g>
  <g fill="#DFE5F5">
    <rect x="136" y="184" width="80" height="10" rx="5"/><rect x="136" y="304" width="80" height="10" rx="5"/>
    <rect x="136" y="424" width="80" height="10" rx="5"/><rect x="136" y="544" width="80" height="10" rx="5"/>
  </g>

  <!-- connectors into the governed stack -->
  <g fill="none" stroke="#78A9FF" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <path d="M240 193 C300 193 300 250 350 250"/>
    <path d="M240 313 C300 313 300 350 350 350"/>
    <path d="M240 433 C300 433 300 450 350 450"/>
    <path d="M240 553 C300 553 300 550 350 550"/>
  </g>

  <!-- governed stack -->
  <rect x="350" y="170" width="470" height="420" rx="22" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2" filter="url(#sh)"/>
  <rect x="350" y="170" width="470" height="9" rx="5" fill="url(#brand)"/>
  <g>
    <rect x="382" y="212" width="406" height="88" rx="12" fill="#EAF1FF"/>
    <rect x="382" y="320" width="406" height="88" rx="12" fill="#DCE8FF"/>
    <rect x="382" y="428" width="406" height="88" rx="12" fill="#C9DBFF"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="404" y="240" width="140" height="14" rx="7"/><rect x="404" y="348" width="140" height="14" rx="7"/><rect x="404" y="456" width="140" height="14" rx="7"/>
    <rect x="404" y="266" width="96" height="10" rx="5"/><rect x="404" y="374" width="96" height="10" rx="5"/><rect x="404" y="482" width="96" height="10" rx="5"/>
  </g>
  <g fill="#0F62FE">
    <circle cx="752" cy="256" r="10"/><circle cx="752" cy="364" r="10" fill="#0043CE"/><circle cx="752" cy="472" r="10" fill="#002D9C"/>
  </g>

  <!-- traced answer on the right -->
  <g fill="none" stroke="#78A9FF" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M820 375 L900 375"/>
  </g>
  <rect x="900" y="270" width="240" height="210" rx="18" fill="url(#brand)" filter="url(#sh)"/>
  <g fill="#FFFFFF">
    <rect x="930" y="310" width="150" height="14" rx="7" opacity="0.95"/>
    <rect x="930" y="340" width="180" height="10" rx="5" opacity="0.65"/>
    <rect x="930" y="366" width="130" height="10" rx="5" opacity="0.65"/>
    <rect x="930" y="410" width="180" height="34" rx="8" opacity="0.18"/>
  </g>
  <circle cx="1020" cy="248" r="22" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="1020" cy="248" r="9" fill="#FFFFFF"/>
</svg>
