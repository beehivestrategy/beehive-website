<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="四条服务线共同指向一个可验收结果：AI 在生产环境中真正运行">
  <title>蜂启咨询四条服务线：对话式 AI、AI 智能体与工具、前置部署工程、培训与能力建设，都指向生产环境中的 AI</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset="0.55" stop-color="#0043CE"/>
      <stop offset="1" stop-color="#002D9C"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DFE5F5"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#wash)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <text x="60" y="58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#0F62FE">我们做什么</text>
  <text x="60" y="98" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" fill="#101828">一个结果，四种切入。</text>
  <text x="60" y="126" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" fill="#4A5568">每条服务线都从真正跑起来的 AI 反向界定。</text>

  <!-- outcome band -->
  <rect x="60" y="158" width="1080" height="104" rx="16" fill="url(#band)"/>
  <text x="92" y="196" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#BFD4FF">我们负责的结果</text>
  <text x="92" y="234" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">AI 在团队日常在用的工具里真正跑起来</text>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
    <rect x="944" y="188" width="56" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="972" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">助理</text>
    <rect x="1008" y="188" width="68" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1042" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">智能体</text>
    <rect x="1084" y="188" width="56" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="1112" y="206" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#FFFFFF">评测</text>
  </g>

  <!-- connectors -->
  <g stroke="#C5CEE6" stroke-width="2">
    <line x1="187" y1="262" x2="187" y2="318"/>
    <line x1="462" y1="262" x2="462" y2="318"/>
    <line x1="737" y1="262" x2="737" y2="318"/>
    <line x1="1012" y1="262" x2="1012" y2="318"/>
  </g>
  <g fill="#0F62FE">
    <circle cx="187" cy="262" r="5"/><circle cx="462" cy="262" r="5"/>
    <circle cx="737" cy="262" r="5"/><circle cx="1012" cy="262" r="5"/>
  </g>

  <!-- four equal service cards -->
  <g>
    <rect x="60" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#0F62FE" stroke-width="2"/>
    <rect x="335" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="610" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
    <rect x="885" y="318" width="255" height="176" rx="14" fill="#FFFFFF" stroke="#DFE5F5" stroke-width="2"/>
  </g>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="84" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#0F62FE">01 · 主焦点</text>
    <text x="84" y="384" font-size="19" font-weight="700" fill="#101828">对话式 AI</text>
    <text x="84" y="414" font-size="13" fill="#4A5568">用自然语言提问，</text>
    <text x="84" y="434" font-size="13" fill="#4A5568">得到受治理、可追溯的答案</text>
    <text x="84" y="464" font-size="12" font-weight="700" fill="#0F62FE">就在渠道里，不用另开平台</text>

    <text x="359" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">02</text>
    <text x="359" y="384" font-size="19" font-weight="700" fill="#101828">AI 智能体与工具</text>
    <text x="359" y="414" font-size="13" fill="#4A5568">挑选智能体并放进沙箱，</text>
    <text x="359" y="434" font-size="13" fill="#4A5568">配好评测、权限</text>
    <text x="359" y="464" font-size="12" font-weight="700" fill="#0043CE">与合规闭环</text>

    <text x="634" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">03</text>
    <text x="634" y="384" font-size="19" font-weight="700" fill="#101828">前置部署工程</text>
    <text x="634" y="414" font-size="13" fill="#4A5568">工程团队驻场交付，</text>
    <text x="634" y="434" font-size="13" fill="#4A5568">建置、部署，数周内</text>
    <text x="634" y="464" font-size="12" font-weight="700" fill="#0043CE">把系统的钥匙交回</text>

    <text x="909" y="352" font-size="11" font-weight="700" letter-spacing="0.6" fill="#8B94A8">04</text>
    <text x="909" y="384" font-size="19" font-weight="700" fill="#101828">培训与能力建设</text>
    <text x="909" y="414" font-size="13" fill="#4A5568">先建立共同语言</text>
    <text x="909" y="434" font-size="13" fill="#4A5568">与内部能力，再</text>
    <text x="909" y="464" font-size="12" font-weight="700" fill="#0043CE">谈签约</text>
  </g>

  <line x1="60" y1="526" x2="1140" y2="526" stroke="#DFE5F5" stroke-width="2"/>
  <text x="60" y="560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="13" fill="#4A5568">每个项目都仍会做数据基础、系统集成与治理——按 AI 结果界定范围，从不把它们当作交付主角。</text>
  <text x="60" y="584" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="700" fill="#0F62FE">不推倒重来，数周内上线首个可用系统。</text>
</svg>
