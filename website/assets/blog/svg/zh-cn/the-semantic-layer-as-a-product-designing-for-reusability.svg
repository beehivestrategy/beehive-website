 stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">可重用语义层的五条设计原则：业务命名、单一权威定义、可组合、版本化、文档化。</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">指标按"基本—派生—复合"三层组织，30到50个核心指标即可覆盖80%以上分析需求。</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">每个指标必须有所有者，口径变更走轻量级审批流程，杜绝静默修改。</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">采用靠机制：唯一下场、工具集成、文档示例、成功案例四管齐下，配专职布道者陪跑。</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>