 stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">流水線模式（Pipeline）：</text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">代理按固定順序依次執行，前一個的輸出作爲後一個的輸入，適合流程穩定、步驟明確的任務（如"取數→分析→生成報告"）</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">路由模式（Router）：</text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">一個入口代理根據問題類型把任務分發給專門的專家代理，適合"分類再處理"的情境（如工單分派、意圖識別）</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">編排者-工人模式（Orchestrator-Worke…</text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">一個編排者代理動態拆解任務、分發給多個工人代理並彙總結果，適合任務可並行分解的複雜情境</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">層次結構模式（Hierarchical）：</text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">多級編排者逐層管理，形成"主編排者→子編排者→執行者"的樹狀結構，適合跨部門的大型業務流程</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>