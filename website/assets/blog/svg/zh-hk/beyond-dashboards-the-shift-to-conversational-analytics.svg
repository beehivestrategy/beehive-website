<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fe"/></linearGradient></defs><rect width="800" height="450" rx="14" fill="url(#bg)"/><line x1="0" y1="0" x2="0" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="48" y1="0" x2="48" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="96" y1="0" x2="96" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="144" y1="0" x2="144" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="192" y1="0" x2="192" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="288" y1="0" x2="288" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="336" y1="0" x2="336" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="384" y1="0" x2="384" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="432" y1="0" x2="432" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="528" y1="0" x2="528" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="576" y1="0" x2="576" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="624" y1="0" x2="624" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="672" y1="0" x2="672" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="768" y1="0" x2="768" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="0" x2="800" y2="0" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="48" x2="800" y2="48" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="96" x2="800" y2="96" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="144" x2="800" y2="144" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="192" x2="800" y2="192" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="240" x2="800" y2="240" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">保留儀錶板用於監控。</text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">有人每天早上要檢查的一組固定、已知的指標，恰恰就是儀錶板擅長的事。不要用聊天窗口去替換一塊用得很好的營運儀表板…</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">用會話做調查。</text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">「爲甚麼北區毛利下滑了？」是一段由八個問題組成的旅程，每個問題都依賴上一個。這在工單時延下令人難以忍受，在會話…</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">用會話處理長尾與一次性問題。</text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">盡調問題、董事會問題，以及第六百零一種組合，永遠都不會有一張圖。這正是開放集優勢的決定性戰場。</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">把跑得起來的累積下來。</text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">當某個問題每週都被問到，就把它提升爲帶告警的受監控指標。會話是發現機制，儀錶板是被驗證問題的畢業去向。</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>