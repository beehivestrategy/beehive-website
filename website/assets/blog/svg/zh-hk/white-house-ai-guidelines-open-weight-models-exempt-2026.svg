m-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">能力等級：</text><text x="80" y="347" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">模型是否具備尖端網絡與黑客能力？只有最前沿的閉源模型才屬於重點監管對象。</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>