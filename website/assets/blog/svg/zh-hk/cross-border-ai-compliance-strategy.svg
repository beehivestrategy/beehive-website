 stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">歐盟AI法案分級。</text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">系統是被禁止的（不可接受風險）、高風險、帶透明度義務的有限風險，還是通用模型？分級決定附著哪些義務——罰款也隨級…</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">中國的數據規則。</text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">系統是否處理中國境內個人的個人資訊、是否跨境傳輸數據、是否生成合成內容？PIPL的合法性基礎與同意規則、跨境傳輸機…</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">行業性法域。</text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">系統是否落在受監管行業——金融、健康、僱傭——美國、歐盟和中國在這些行業各自在通用法域之上疊加行業規則？</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">透明度與標識。</text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">歐盟AI法案和中國的標識辦法都要求告知用戶正在與AI交互、並要求標識AI生成內容——兩個法域、一種能力，只要在生成時一…</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>