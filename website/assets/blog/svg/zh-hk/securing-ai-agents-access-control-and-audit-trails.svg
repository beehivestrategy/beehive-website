 stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">每個查詢都有代理與用戶雙重身份，都必須認證、綁定並記錄，委託鏈完整可追溯。</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">RBAC細化到字段與行級，高風險情境疊加ABAC，語意層在查詢級別強制執行，杜絕越權可見。</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">審計日誌覆蓋查詢全鏈路、防篡改，滿足PIPL與SOC 2合規並配套調查與質素改進。</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700"></text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">監控基於行爲基線實時告警，與SOC聯動，用響應劇本把處置時間縮短四成以上。</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>