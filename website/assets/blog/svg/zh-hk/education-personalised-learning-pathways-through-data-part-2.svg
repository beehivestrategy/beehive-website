<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0f4fe"/></linearGradient></defs><rect width="800" height="450" rx="14" fill="url(#bg)"/><line x1="0" y1="0" x2="0" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="48" y1="0" x2="48" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="96" y1="0" x2="96" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="144" y1="0" x2="144" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="192" y1="0" x2="192" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="288" y1="0" x2="288" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="336" y1="0" x2="336" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="384" y1="0" x2="384" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="432" y1="0" x2="432" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="528" y1="0" x2="528" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="576" y1="0" x2="576" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="624" y1="0" x2="624" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="672" y1="0" x2="672" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="768" y1="0" x2="768" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="0" x2="800" y2="0" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="48" x2="800" y2="48" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="96" x2="800" y2="96" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="144" x2="800" y2="144" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="192" x2="800" y2="192" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="240" x2="800" y2="240" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">學習增益，而非活動量。</text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">在同一構念上做前測與後測，並把增益與對照組比較。完成的題目數不是學習指標。</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">延遲後的留存。</text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">四到十二週後再測一次。在即時後測上表現優異的項目，常常在延遲測試中顯示不出優勢，因爲它們優化的是練習期間的臨場…</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">遷移。</text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">學生能否在新情境中應用這個概念？這是最難度量的，也是最有意義的。</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">達到精熟所需時間。</text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">效率指標：這條路徑能否讓學生更快地達到同一標準？這常常是最有力的商業論證，因爲時間正是教師真正感受到的約束。</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>