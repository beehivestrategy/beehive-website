<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fbfcff"/><stop offset="1" stop-color="#f0f4fe"/></linearGradient></defs><rect width="800" height="450" rx="14" fill="url(#bg)"/><line x1="0" y1="0" x2="0" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="48" y1="0" x2="48" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="96" y1="0" x2="96" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="144" y1="0" x2="144" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="192" y1="0" x2="192" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="240" y1="0" x2="240" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="288" y1="0" x2="288" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="336" y1="0" x2="336" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="384" y1="0" x2="384" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="432" y1="0" x2="432" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="480" y1="0" x2="480" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="528" y1="0" x2="528" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="576" y1="0" x2="576" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="624" y1="0" x2="624" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="672" y1="0" x2="672" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="720" y1="0" x2="720" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="768" y1="0" x2="768" y2="450" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="0" x2="800" y2="0" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="48" x2="800" y2="48" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="96" x2="800" y2="96" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="144" x2="800" y2="144" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="192" x2="800" y2="192" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="240" x2="800" y2="240" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="288" x2="800" y2="288" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="336" x2="800" y2="336" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="384" x2="800" y2="384" stroke="#eef2fb" stroke-width="1"/><line x1="0" y1="432" x2="800" y2="432" stroke="#eef2fb" stroke-width="1"/><text x="60" y="58" font-size="19" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">落地前提</text><rect x="60" y="92" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="92" width="5" height="66" rx="2.5" fill="#0F62FE"/><text x="80" y="118" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">分塊策略一刀切：</text><text x="80" y="138" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">不同文檔類型需要不同分塊邏輯，制度文檔按條款、產品文檔按模塊、長文按語意段落；忽視結構會導致語意割裂或上下文丟…</text><rect x="60" y="170" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="170" width="5" height="66" rx="2.5" fill="#0043CE"/><text x="80" y="196" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">元數據缺失：</text><text x="80" y="216" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">不標記來源、業務域、權限等級與更新時間，導致無法過濾過期內容、無法實現權限控制</text><rect x="60" y="249" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="249" width="5" height="66" rx="2.5" fill="#8fb0ff"/><text x="80" y="275" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">純向量檢索：</text><text x="80" y="295" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">專有名詞、型號編碼等精確匹配情境必須結合BM25關鍵詞檢索，純向量檢索會系統性漏檢</text><rect x="60" y="328" width="680" height="66" rx="9" fill="#ffffff" stroke="#dfe5f5" stroke-width="1.5"/><rect x="60" y="328" width="5" height="66" rx="2.5" fill="#6f9bff"/><text x="80" y="354" font-size="13.5" fill="#101828" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif" font-weight="700">無評估集投入運作：</text><text x="80" y="374" font-size="11.5" fill="#4A5568" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">不建立真實問題評估集，就無法量化準確率，優化變成"感覺調優"</text><text x="60" y="430" font-size="12" fill="#8B94A8" font-family="system-ui,-apple-system,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,Helvetica,Arial,sans-serif">Beehive Strategy</text></svg>